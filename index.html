<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeus Templo Fitness</title>
<meta name="theme-color" content="#0b0e10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: Acero. Gris grafito, un solo acento turquesa tomado del logo, superficies delineadas con líneas finas en lugar de rellenos.
   Columna de teléfono, barra de pestañas abajo, hojas que suben desde abajo para detalle y carga. */
:root{
  color-scheme:dark;
  --noche:#0b0e10; --piedra:#12171a; --piedra2:#2a3033; --linea:#30373a;
  --marmol:#eef1f1; --humo:#8c979a; --rayo:#2fc4c0; --teal:#2fc4c0;
  --ok:#a9b6b8; --warn:#f0a05a; --bad:#f07a7a;
  --f-display:"Saira","Barlow",system-ui,sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#050708;color:var(--marmol);font-family:var(--f-body);font-size:15px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rayo);outline-offset:2px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--noche);display:flex;flex-direction:column;overflow:hidden}

/* modo de vista (solo del modelo) */
.modo{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#050708;font-family:var(--f-cond);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--humo)}
.modo .seg{display:flex;margin-left:auto;border:1px solid var(--linea);border-radius:8px;overflow:hidden}
.modo .seg button{background:none;border:0;padding:5px 12px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-cond);font-size:13px;color:var(--humo)}
.modo .seg button[aria-pressed="true"]{background:var(--rayo);color:#06201f;font-weight:700}
.modo select{background:var(--piedra);border:1px solid var(--linea);border-radius:8px;padding:4px 6px;font-size:13px;max-width:130px}

header.marca[hidden]{display:none}
header.marca{padding:14px 16px 0;display:flex;flex-direction:column;gap:10px}
.marca .fila{display:flex;align-items:center;gap:10px}
.marca .quien{margin-left:auto;text-align:right;font-size:13px;color:var(--humo)}
.logo{height:54px;width:auto;border-radius:6px;display:block}
.filo{height:2px;background:linear-gradient(90deg,var(--teal),var(--rayo) 45%,transparent)}
.portada{width:86%;margin:8px auto 4px;height:auto;border-radius:10px;display:block}

main{flex:1;overflow-y:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px}
main>*{flex:none}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.01em;margin:0;text-wrap:balance}
.rot{font-family:var(--f-cond);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--humo)}
.num{font-family:var(--f-cond);font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--humo)}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:10px}

.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tile{background:var(--piedra);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tile .num{font-size:28px;line-height:1}
.total{background:var(--piedra);border-left:3px solid var(--teal);border-radius:4px 12px 12px 4px;padding:12px 14px}
.total .num{font-size:38px;line-height:1.05}

.lista{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--linea);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .nom{font-weight:600}
.item small{color:var(--humo);display:block}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--piedra2);display:grid;place-items:center;font-family:var(--f-cond);font-weight:700;font-size:15px;flex:none}
.pill{font-family:var(--f-cond);font-weight:600;font-size:13px;letter-spacing:.04em;padding:3px 9px;border-radius:6px;white-space:nowrap;border:1px solid}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.pill.bad{color:#fff;background:var(--bad);border-color:var(--bad)}

.btn{border:1px solid var(--linea);background:var(--piedra);border-radius:10px;padding:10px 14px;font-weight:600;text-decoration:none;color:var(--marmol);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.rayo{background:var(--rayo);border-color:var(--rayo);color:#06201f}
.btn.chico{padding:6px 11px;font-size:14px}
.btn.fant{background:none}
.btn.pel{color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--linea);background:none;border-radius:8px;padding:6px 13px;font-family:var(--f-cond);font-weight:600;font-size:14.5px;letter-spacing:.03em;color:var(--humo)}
.chip[aria-pressed="true"]{background:var(--marmol);color:var(--noche);border-color:var(--marmol)}
input[type=text],input[type=tel],input[type=password],input[type=number],input[type=search],select{background:var(--piedra);border:1px solid var(--linea);border-radius:10px;padding:10px 12px;width:100%}
label.campo{display:flex;flex-direction:column;gap:4px}

.card{background:var(--piedra);border-radius:14px;padding:12px}
.figbox{background:var(--noche);border-radius:10px;flex:none}
.figbox svg{display:block;width:100%;height:100%}
.thumb{width:56px;height:56px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ejcard{background:var(--piedra);border:0;border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px}
.ejcard .figbox{aspect-ratio:1/0.8}
.ejcard b{font-weight:600;line-height:1.2}

/* bloques de rutina */
.bloque{background:var(--piedra);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.bloque.super{border-left:3px solid var(--teal);border-radius:4px 14px 14px 4px}
.bloque .cab{display:flex;align-items:center;gap:8px}
.etq{font-family:var(--f-cond);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--teal)}
.ejfila{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;width:100%}
.letra{font-family:var(--f-cond);font-weight:700;color:var(--teal);width:20px;flex:none;font-size:16px}
input.mini{width:58px;flex:none;padding:7px 6px;text-align:center;font-family:var(--f-cond);font-weight:600;font-size:16px}
input.mini.reps{width:76px}
.x{color:var(--humo);font-family:var(--f-cond)}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--linea);background:none;font-family:var(--f-cond);font-weight:700;font-size:15px;color:var(--humo)}
.set[aria-pressed="true"]{background:var(--rayo);border-color:var(--rayo);color:#06201f}
.icon{background:none;border:0;color:var(--humo);padding:6px 8px;font-size:18px;line-height:1}

nav.tabs{display:flex;border-top:1px solid var(--linea);background:var(--piedra)}
nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 12px;font-family:var(--f-cond);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--humo);border-top:2px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--rayo);border-top-color:var(--rayo)}

.velo{position:absolute;inset:0;background:rgba(0,3,4,.78);display:flex;align-items:flex-end;z-index:5}
.hoja{background:var(--noche);border-top:1px solid var(--linea);border-radius:18px 18px 0 0;width:100%;max-height:92%;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.hoja .cab{display:flex;align-items:flex-start;gap:10px}
.mapa{display:flex;gap:14px;align-items:center}
.mapa svg{width:150px;flex:none}
.ley{display:flex;flex-direction:column;gap:8px;font-size:14px}
.ley i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.modo[hidden]{display:none}
.red{background:var(--warn);color:#1a0d02;font-weight:600;font-size:13px;text-align:center;padding:4px 12px}
.red:empty{display:none}
.pin{font-family:var(--f-cond);font-weight:700;font-size:56px;letter-spacing:.2em;text-align:center;color:var(--rayo);line-height:1.1}
#toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);max-width:90%;text-align:center;background:var(--marmol);color:var(--noche);padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;width:max-content}
#toast.on{opacity:1}
.nota{font-size:13px;color:var(--humo);border:1px dashed var(--linea);border-radius:10px;padding:8px 10px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* Acero: contornos en lugar de rellenos */
.card,.tile,.total,.bloque,.ejcard{background:transparent;border:1px solid var(--linea);border-radius:4px}
.total,.bloque.super{border-left:3px solid var(--teal);border-radius:0}
.total .num{color:var(--rayo)}
.figbox{background:var(--piedra);border-radius:4px}
.btn{border-radius:4px;background:transparent}
.btn.rayo{background:transparent;border-color:var(--rayo);color:var(--rayo)}
.chip{border-radius:4px}
.chip[aria-pressed="true"]{background:transparent;color:var(--rayo);border-color:var(--rayo)}
.pill,.pill.bad{border:0;padding:0;background:none}
.pill.bad{color:var(--bad)}
input[type=text],input[type=tel],input[type=password],input[type=number],input[type=search],select{border-radius:4px;background:transparent}
select option{background:var(--piedra)}
.hoja{border-radius:8px 8px 0 0}
nav.tabs{background:var(--noche)}
.avatar{background:transparent;border:1px solid var(--linea)}
.filo{height:1px;background:var(--linea)}
.logo,.portada{border-radius:4px}
.modo .seg,.modo select{border-radius:4px}

/* Templo: fondos, botones e íconos de imagen */
#app{background:#0b0e10 url(bg-app.jpg) center top/cover no-repeat}
#app.entrada{background-image:url(bg-entrada.jpg)}
.card,.tile,.total,.bloque,.ejcard{background:rgba(8,12,14,.62)}
.btn{border:solid transparent;border-width:11px 14px;border-image:url(btn-linea.png) 30 34 fill stretch;padding:1px 6px;background:none;border-radius:0;color:var(--marmol)}
.btn.rayo{border-image-source:url(btn-lleno.png);color:#eafcff;background:none}
.btn.chico{border-width:8px 11px;padding:0 4px}
.btn.fant{border:1px solid transparent;border-image:none;padding:6px 10px}
.btn.pel{color:var(--bad)}
nav.tabs{background:rgba(5,7,8,.92)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px 9px}
nav.tabs img{width:26px;height:26px;opacity:.4;filter:grayscale(.7)}
nav.tabs button[aria-current="page"] img{opacity:1;filter:none}
.hoja{background:#0b0e10}
.entrada .portada{width:92%;margin:28px auto 20px}
.figbox img,.figbox video{width:100%;height:100%;object-fit:contain;display:block;border-radius:4px}
.dos{position:relative;width:100%;height:100%}
.dos img{position:absolute;inset:0}
.dos img:nth-child(2){animation:alterna 2.6s steps(1) infinite}
@keyframes alterna{0%,49.9%{opacity:0}50%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dos img:nth-child(2){animation:none}}
.cred{margin:0;font-size:12px;text-align:center}.cred a{color:var(--humo)}
.set.hecho{width:auto;min-width:38px;padding:0 10px;border-radius:19px;background:var(--rayo);border-color:var(--rayo);color:#06201f}
.kgrow{gap:6px}
.paso{width:34px;height:34px;flex:none;border:1px solid var(--linea);background:transparent;border-radius:4px;font-size:18px;line-height:1;color:var(--marmol)}
.sep{height:1px;background:var(--linea)}
.cap::first-letter{text-transform:uppercase}
.barra{height:6px;background:var(--piedra2);border-radius:3px;overflow:hidden}.barra i{display:block;height:100%;background:var(--rayo)}
.semana{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.cd{aspect-ratio:1;border:1px solid transparent;border-radius:4px;background:transparent;font-family:var(--f-cond);font-weight:600;font-size:15px;color:var(--humo);padding:0}
.cd:disabled{cursor:default}
.cd.ok{background:var(--rayo);color:#06201f}
.cd.par{border-color:var(--rayo);color:var(--rayo)}
.cd.no{border-color:var(--bad);color:var(--bad)}
.cd.plan{border-color:var(--linea);border-style:dashed;color:var(--marmol)}
.cd.hoy{outline:2px solid var(--marmol);outline-offset:1px}
.ley2{gap:6px 14px;font-size:13px;color:var(--humo)}
.ley2 i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid transparent}
.ley2 i.ok{background:var(--rayo)}.ley2 i.par{border-color:var(--rayo)}.ley2 i.no{border-color:var(--bad)}.ley2 i.plan{border-color:var(--linea);border-style:dashed}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--rayo);flex:none}
</style>
</head>
<body>
<div id="app">
  <div class="red" id="red" role="status"></div>
  <div class="modo" id="modo"></div>
  <header class="marca">
    <div class="fila">
      <img class="logo" src="logo.png" alt="Zeus Templo Fitness" width="900" height="423">
      <div class="quien" id="quien"></div>
    </div>
    <div class="filo" aria-hidden="true"></div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
  <div id="sheet"></div>
  <div id="toast" role="status"></div>
</div>
<script src="config.js"></script>
<script>
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pesos=n=>'$'+Math.round(n).toLocaleString('es-AR');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const HOY=new Date();HOY.setHours(0,0,0,0);
const deIso=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const mas=(n,base=HOY)=>{const d=new Date(base);d.setDate(d.getDate()+n);return iso(d)};
const masMes=s=>{const d=deIso(s);d.setMonth(d.getMonth()+1);return iso(d)};
const dias=s=>Math.round((deIso(s)-HOY)/864e5);
const fecha=s=>deIso(s).toLocaleDateString('es-AR',{day:'numeric',month:'short'});
const uid=()=>Math.random().toString(36).slice(2,9);
const inic=n=>n.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),1900)}

/* ---------- músculos y ejercicios ---------- */
const M={pecho:'Pecho',hombros:'Hombros',biceps:'Bíceps',triceps:'Tríceps',antebrazos:'Antebrazos',abdomen:'Abdomen',cuadriceps:'Cuádriceps',isquios:'Isquiotibiales',gluteos:'Glúteos',gemelos:'Gemelos',dorsales:'Dorsales',trapecio:'Trapecio',lumbares:'Lumbares'};
const GRUPOS_M=['Pecho','Espalda','Piernas','Glúteos','Hombros','Brazos','Core'];
const EJ_BASE=[
 {id:'sentadilla',nombre:'Sentadilla con barra',grupo:'Piernas',prim:['cuadriceps','gluteos'],sec:['isquios','lumbares','abdomen'],equipo:'Barra y rack',tip:'Pies al ancho de hombros. Bajá hasta que el muslo quede paralelo al piso, con la espalda firme.'},
 {id:'banca',nombre:'Press de banca',grupo:'Pecho',prim:['pecho'],sec:['triceps','hombros'],equipo:'Banco y barra',tip:'Bajá la barra al pecho de forma controlada y empujá sin despegar la espalda del banco.'},
 {id:'muerto',nombre:'Peso muerto',grupo:'Espalda',prim:['isquios','gluteos','lumbares'],sec:['trapecio','antebrazos','cuadriceps'],equipo:'Barra',tip:'La barra sube pegada a las piernas. Espalda recta de principio a fin.'},
 {id:'dominadas',nombre:'Dominadas',grupo:'Espalda',prim:['dorsales'],sec:['biceps','trapecio','antebrazos'],equipo:'Barra fija',tip:'Subí hasta pasar el mentón por encima de la barra y bajá estirando los brazos por completo.'},
 {id:'militar',nombre:'Press militar',grupo:'Hombros',prim:['hombros'],sec:['triceps','trapecio','abdomen'],equipo:'Barra',tip:'Empujá la barra en línea recta sobre la cabeza, con el abdomen apretado.'},
 {id:'vuelos',nombre:'Vuelos laterales',grupo:'Hombros',prim:['hombros'],sec:['trapecio'],equipo:'Mancuernas',tip:'Subí los brazos hasta la altura de los hombros con los codos apenas flexionados.'},
 {id:'curl',nombre:'Curl de bíceps',grupo:'Brazos',prim:['biceps'],sec:['antebrazos'],equipo:'Mancuernas',tip:'Codos pegados al cuerpo. Subí sin balancear el torso.'},
 {id:'triceps',nombre:'Extensión de tríceps en polea',grupo:'Brazos',prim:['triceps'],sec:['antebrazos'],equipo:'Polea alta',tip:'Solo se mueve el antebrazo. Estirá el brazo por completo abajo.'},
 {id:'remo',nombre:'Remo con barra',grupo:'Espalda',prim:['dorsales','trapecio'],sec:['biceps','lumbares'],equipo:'Barra',tip:'Torso inclinado y firme. Llevá la barra hacia el ombligo juntando las escápulas.'},
 {id:'zancadas',nombre:'Zancadas',grupo:'Piernas',prim:['cuadriceps','gluteos'],sec:['isquios','gemelos'],equipo:'Mancuernas',tip:'Paso largo. La rodilla de atrás baja casi hasta el piso y el torso queda vertical.'},
 {id:'hipthrust',nombre:'Hip thrust',grupo:'Glúteos',prim:['gluteos'],sec:['isquios','lumbares'],equipo:'Banco y barra',tip:'Espalda alta apoyada en el banco. Subí la cadera y apretá los glúteos un segundo arriba.'},
 {id:'gemelos',nombre:'Elevación de talones',grupo:'Piernas',prim:['gemelos'],sec:[],equipo:'Mancuernas',tip:'Subí lo más alto posible sobre la punta de los pies y bajá lento.'},
 {id:'flexiones',nombre:'Flexiones de brazos',grupo:'Pecho',prim:['pecho'],sec:['triceps','hombros','abdomen'],equipo:'Sin equipo',tip:'Cuerpo en línea recta, de la cabeza a los talones. Pecho casi al piso.'},
 {id:'plancha',nombre:'Plancha',grupo:'Core',prim:['abdomen'],sec:['hombros','lumbares','gluteos'],equipo:'Sin equipo',tip:'Antebrazos apoyados, cadera alineada. Se mide en segundos, no en repeticiones.'},
 {id:'crunch',nombre:'Abdominales cortos',grupo:'Core',prim:['abdomen'],sec:[],equipo:'Colchoneta',tip:'Despegá solo los hombros del piso, sin tirar del cuello.'}
];

/* ---------- maniquí animado: dibujo y movimiento por código ---------- */
const RG={B:'#c3cccf',F:'#5f6b6f',P:'#2fc4c0',S:'#1c6f6d',E:'#8a9599',D:'#2a3033',O:' stroke="#0b0e10" stroke-opacity=".55" stroke-width=".8"'};
const rD=a=>{a*=Math.PI/180;return[Math.sin(a),-Math.cos(a)]};
const rA=(p,v,k=1)=>[p[0]+v[0]*k,p[1]+v[1]*k];
const rf=n=>n.toFixed(1);
function rIK(a,c,l1,l2,s){const dx=c[0]-a[0],dy=c[1]-a[1],d=Math.max(1,Math.min(Math.hypot(dx,dy),l1+l2-.01)),g=Math.atan2(dy,dx),k=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))));return[a[0]+l1*Math.cos(g+s*k),a[1]+l1*Math.sin(g+s*k)]}
function rCap(p,q,r1,r2,c,o=''){const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||1,n=[dy/l,-dx/l],a=rA(p,n,r1),b=rA(q,n,r2),e=rA(q,n,-r2),g=rA(p,n,-r1);
  return`<path d="M${rf(a[0])} ${rf(a[1])}L${rf(b[0])} ${rf(b[1])}A${r2} ${r2} 0 0 1 ${rf(e[0])} ${rf(e[1])}L${rf(g[0])} ${rf(g[1])}A${r1} ${r1} 0 0 1 ${rf(a[0])} ${rf(a[1])}Z" fill="${c}"${o}/>`}

  const ord=[...D.socios].sort((a,b)=>dias(a.vence)-dias(b.vence));
  const venc=ord.filter(s=>estado(s).k==='bad'),prox=ord.filter(s=>estado(s).k==='warn');
  const mes=HOY.getMonth(),an=HOY.getFullYear();
  const todos=D.socios.flatMap(s=>s.pagos.map(p=>({...p,s}))).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const delMes=todos.filter(p=>{const d=deIso(p.fecha);return d.getMonth()===mes&&d.getFullYear()===an});
  const cobrado=delMes.reduce((t,p)=>t+p.monto,0);
  const falta=[...venc,...prox].reduce((t,s)=>t+plan(s.plan).precio,0);
  const fila=s=>{const e=estado(s);return`<div class="item"><button class="row grow" style="background:none;border:0;padding:0;text-align:left" data-a="verSocio" data-id="${s.id}"><span class="avatar">${inic(s.nombre)}</span><span class="grow"><span class="nom">${esc(s.nombre)}</span><small>${esc(plan(s.plan).nombre)} · ${pesos(plan(s.plan).precio)}</small></span></button><span class="pill ${e.k}">${e.t}</span><button class="btn rayo chico" data-a="cobrar" data-id="${s.id}">Cobrar</button></div>`};
  const avis=D.avisos.filter(a=>socio(a.socioId)).map(a=>{const s=socio(a.socioId);return`<div class="item"><span class="grow"><span class="nom">${esc(s.nombre)}</span><small>Avisó que transfirió · ${pesos(plan(s.plan).precio)}</small></span><button class="btn chico fant" data-a="descartarAviso" data-id="${s.id}">Descartar</button><button class="btn rayo chico" data-a="cobrar" data-id="${s.id}" data-medio="Transferencia">Confirmar</button></div>`}).join('');
  return`${avis?`<section class="col"><h2>Avisos de transferencia</h2><div class="lista">${avis}</div></section>`:''}<div class="total"><div class="rot">Cobrado en ${HOY.toLocaleDateString('es-AR',{month:'long'})}</div><div class="num">${pesos(cobrado)}</div><div class="muted">${delMes.length} pagos · falta cobrar ${pesos(falta)}</div></div>
  <div class="tiles"><div class="tile"><span class="num" style="color:var(--bad)">${venc.length}</span><span class="rot">Vencidas</span></div><div class="tile"><span class="num" style="color:var(--warn)">${prox.length}</span><span class="rot">Por vencer</span></div><div class="tile"><span class="num">${D.socios.length}</span><span class="rot">Socios</span></div></div>
  <section class="col"><h2>Para cobrar</h2><div class="lista">${[...venc,...prox].map(fila).join('')||'<p class="muted">Nadie debe la cuota. Todo al día.</p>'}</div></section>
  <section class="col"><h2>Últimos pagos</h2><div class="lista">${todos.slice(0,6).map(p=>`<div class="item"><span class="grow"><span class="nom">${esc(p.s.nombre)}</span><small>${fecha(p.fecha)} · ${esc(p.medio)}</small></span><span class="num" style="font-size:18px">${pesos(p.monto)}</span></div>`).join('')||'<p class="muted">Todavía no hay pagos registrados.</p>'}</div></section>
  <button class="btn" data-a="ajustes">Planes, precios y alias</button>`;
}
function listaSocios(){
  const q=S.q.toLowerCase();

  return l.map(s=>{const e=estado(s),r=rutinaDe(s);return`<button class="item" data-a="verSocio" data-id="${s.id}"><span class="avatar">${inic(s.nombre)}</span><span class="grow"><span class="nom">${esc(s.nombre)}</span><small>${r?esc(r.nombre):'Sin rutina'}</small></span><span class="pill ${e.k}">${e.t}</span></button>`}).join('')||'<p class="muted">No hay socios con ese filtro.</p>';
}

function filaEj(it,letra,edit,bi,ii){const e=ej(it.ej);

function vRutinas(){

    ${b.items.map((it,ii)=>filaEj(it,t?'ABCDEFGH'[ii]:'',true,bi,ii)).join('')}
    <div class="row wrap"><input class="mini" type="number" min="1" value="${b.series}" aria-label="${t?'Vueltas':'Series'}" data-c="series" data-b="${bi}"><span class="x">${t?'vueltas':'series'}</span><input class="mini" type="number" min="0" step="15" value="${b.descanso}" aria-label="Descanso en segundos" data-c="descanso" data-b="${bi}"><span class="x">s de descanso</span><span class="grow"></span><button class="btn chico fant" data-a="elegir" data-modo="item" data-b="${bi}">+ combinar</button></div></div>`}).join('')||'<p class="muted">Este día todavía no tiene ejercicios.</p>'}
  <div class="row"><button class="btn rayo grow" data-a="elegir" data-modo="simple">+ Ejercicio</button><button class="btn grow" data-a="elegir" data-modo="multi">+ Superserie</button></div>
  <p class="nota">Combinando 2 ejercicios queda una superserie, con 3 una triserie y con 4 o más un circuito.</p>`;
}

/* ---------- datos propios del socio: semana, registro e historial ---------- */
let MD={sem:{},log:{}},MDV=0,MDSRV=false,MDRO=false,mdT=0,mdBusy=false,mdDirty=false;
const DSEM=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],DSEML=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const hoyS=()=>iso(HOY),wd=f=>deIso(f).getDay()||7;
const mdNorm=d=>{d=d&&typeof d==='object'?d:{};d.sem=d.sem||{};d.log=d.log||{};d.rutinas=d.rutinas||[];if(d.comparte===undefined)d.comparte=true;return d};
const mdKey=id=>'zeus-md-'+id;
const planDe=(r,di)=>r.dias[di].bloques.map(b=>({s:b.series,d:b.descanso,it:b.items.map(i=>({ej:i.ej,reps:i.reps}))}));
const totDe=p=>p.reduce((t,b)=>t+b.s*b.it.length,0);
const nSets=L=>Object.keys(L.sets||{}).length;
const entrada=(r,di,x)=>{const p=planDe(r,di);return Object.assign({rut:r.id,dia:di,nombre:r.dias[di].nombre,sets:{},plan:p,tot:totDe(p)},x||{})};
const semDef=r=>{const o={},pat={1:[1],2:[1,4],3:[1,3,5],4:[1,2,4,5],5:[1,2,3,4,5]}[r.dias.length]||[1,2,3,4,5,6,7];pat.forEach((w,i)=>{if(r.dias[i])o[w]=i});return o};
const numKg=k=>String(k).replace('.',',');
const txtSet=x=>(x.kg?numKg(x.kg)+' kg':'')+(x.kg&&x.reps?' × ':'')+(x.reps||(x.kg?'':'hecho'));
function mdDemo(s){
  const md=mdNorm({}),r=rutinaDe(s);if(!r)return md;
  md.sem=semDef(r);md.semRut=r.id;md.semDesde=mas(-24);
  let seed=[...s.id].reduce((a,c)=>a+c.charCodeAt(0),7);const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let i=24;i>=1;i--){const f=mas(-i),di=md.sem[wd(f)];if(di==null)continue;const x=rnd();if(x<.16)continue;
    const E=entrada(r,di);
    E.plan.forEach((b,bi)=>b.it.forEach((it,ii)=>{const sin=['flexiones','plancha','crunch','dominadas'].includes(it.ej),base=20+((it.ej.length*7+bi*5)%8)*5+Math.floor((24-i)/7)*2.5;
      for(let n=0;n<b.s;n++){if(x<.3&&bi>=2)continue;E.sets[bi+'-'+ii+'-'+n]={kg:sin?0:base,reps:/^\d+$/.test(it.reps)?it.reps:(sin?'12':'10')}}}));
    md.log[f]=E}
  return md;
}
async function mdLoad(){
  MDRO=false;MDSRV=false;MDV=0;S.ed={};clearTimeout(mdT);mdDirty=false;
  if(REAL&&S.ses&&S.ses.rol==='socio'){try{const j=await api('socio_datos_get',{p_token:tk()});MD=mdNorm(j.datos);MDV=j.version||0;MDSRV=true;return}catch(e){}}
  if(REAL&&S.ses&&S.ses.rol==='admin'){MDRO=true;try{const j=await api('admin_socio_datos',{p_token:tk(),p_socio:S.socioId});MD=mdNorm(j.privado?{}:j.datos)}catch(e){MD=mdNorm({})}return}
  let d;try{d=JSON.parse(localStorage.getItem(mdKey(S.socioId)))}catch(e){}
  if(!d&&!REAL&&socio(S.socioId)){d=mdDemo(socio(S.socioId));try{localStorage.setItem(mdKey(S.socioId),JSON.stringify(d))}catch(e){}}
  MD=mdNorm(d);
}
function mdSave(){
  if(MDRO)return;
  if(MDSRV){mdDirty=true;clearTimeout(mdT);mdT=setTimeout(mdPush,800);return}
  try{localStorage.setItem(mdKey(S.socioId),JSON.stringify(MD))}catch(e){}
}
async function mdPush(){
  if(mdBusy){clearTimeout(mdT);mdT=setTimeout(mdPush,400);return}mdBusy=true;mdDirty=false;
  try{const j=await api('socio_datos_save',{p_token:tk(),p_datos:MD,p_version:MDV});MDV=j.version;setRed('')}
  catch(e){if(e.message==='conflicto'){mdBusy=false;await mdLoad();render();toast('Se actualizaron tus datos desde otro dispositivo.');return}
    if(e.message==='red'){mdDirty=true;setRed('Sin conexión. Los cambios se guardan cuando vuelva.');mdT=setTimeout(mdPush,5000)}}
  mdBusy=false;
}
function rutAct(s){if(s&&s.propias!==false&&MD.activa){const r=(MD.rutinas||[]).find(x=>x.id===MD.activa);if(r)return r}return s?rutinaDe(s):null}
function conMD(md,fn){const o=MD;MD=mdNorm(md);try{return fn()}finally{MD=o}}
function semDe(r){if(MD.semRut===r.id&&MD.sem)return MD.sem;MD.sem=semDef(r);MD.semRut=r.id;MD.semDesde=hoyS();mdSave();return MD.sem}
function est(f,r){const L=MD.log[f],h=hoyS();
  if(L){const n=nSets(L);if(n>=L.tot&&L.tot>0)return'ok';if(n>0)return'par';return(L.falta||f<h)?'no':'plan'}
  if(!r)return'';const di=MD.sem[wd(f)];if(di==null||!r.dias[di])return'';
  if(f>=h)return'plan';return(MD.semDesde&&f>=MD.semDesde)?'no':''}
function cerrarFaltas(r){if(!MD.semDesde)return;for(let d=deIso(MD.semDesde);iso(d)<hoyS();d.setDate(d.getDate()+1)){const f=iso(d),di=MD.sem[wd(f)];if(!MD.log[f]&&di!=null&&r.dias[di])MD.log[f]=entrada(r,di,{falta:true,auto:1})}}
function histEj(){const h={};Object.keys(MD.log).sort().forEach(f=>{const L=MD.log[f];for(const k in L.sets||{}){const p=k.split('-'),it=L.plan&&L.plan[p[0]]&&L.plan[p[0]].it[p[1]];if(!it)continue;(h[it.ej]=h[it.ej]||[]).push({f,kg:+L.sets[k].kg||0,reps:L.sets[k].reps||''})}});return h}
const tipoPlan=b=>b.it.length===1?null:b.it.length===2?'Superserie':b.it.length===3?'Triserie':'Circuito';

function bloquesHoy(plan,L,h){
  return plan.map((b,bi)=>{const t=tipoPlan(b);
    return`<div class="bloque ${t?'super':''}">${t?`<div class="cab"><span class="etq">${t}</span><span class="muted">sin descanso entre ejercicios</span></div>`:''}
    ${b.it.map((it,ii)=>{const e=ej(it.ej),k=bi+'-'+ii,prev=(h[it.ej]||[]).filter(x=>x.f<hoyS()),lf=prev.length?prev[prev.length-1].f:null,ult=lf?prev.filter(x=>x.f===lf).sort((a,c)=>c.kg-a.kg)[0]:null;
      const hechos=Array.from({length:b.s},(_,n)=>L?L.sets[k+'-'+n]:undefined),uh=[...hechos].reverse().find(Boolean);
      const ed=S.ed[k]||{kg:uh?uh.kg||'':(ult&&ult.kg?ult.kg:''),reps:uh?uh.reps:(/^\d+$/.test(String(it.reps).trim())?it.reps:(ult?ult.reps:''))};
      return`<div class="col" style="gap:8px">
      <div class="row">${t?`<span class="letra">${'ABCDEFGH'[ii]}</span>`:''}<button class="ejfila grow" data-a="verEj" data-id="${e.id}"><span class="figbox thumb">${mini(e)}</span><span class="grow"><b style="font-weight:600">${esc(e.nombre)}</b><small class="muted" style="display:block">${b.s} × ${esc(it.reps)}${ult?` · última vez ${txtSet(ult)}`:''}</small></span></button></div>
      <div class="row kgrow"><button class="paso" data-a="kgmas" data-k="${k}" data-v="-2.5" aria-label="Bajar 2,5 kilos">−</button><input class="mini" id="kg-${k}" data-ed="kg" data-k="${k}" type="number" step="0.5" min="0" inputmode="decimal" value="${ed.kg}" placeholder="kg" aria-label="Kilos de ${esc(e.nombre)}"><button class="paso" data-a="kgmas" data-k="${k}" data-v="2.5" aria-label="Subir 2,5 kilos">+</button><span class="x">kg ×</span><input class="mini" id="rp-${k}" data-ed="reps" data-k="${k}" type="text" inputmode="numeric" value="${esc(ed.reps)}" placeholder="reps" aria-label="Repeticiones de ${esc(e.nombre)}"></div>
      <div class="sets">${hechos.map((x,n)=>`<button class="set ${x?'hecho':''}" aria-pressed="${!!x}" aria-label="Serie ${n+1}" data-a="serie" data-k="${k}-${n}">${x?esc((x.kg?numKg(x.kg)+'×':'')+(x.reps||'✓')):n+1}</button>`).join('')}</div></div>`}).join('<div class="sep"></div>')}
    <small class="muted">${b.d} s de descanso</small></div>`}).join('');
}
function vHoy(){
  const s=socio(S.socioId),r=rutAct(s),e=estado(s),hs=hoyS();
  const aviso=e.k!=='ok'?`<button class="card row" style="border:1px solid var(--${e.k});text-align:left;width:100%" data-a="tab" data-v="cuota"><span class="grow"><b>${e.t}</b><small class="muted" style="display:block">Tocá para ver cómo pagar la cuota</small></span><span class="muted">›</span></button>`:'';
  const cab=t=>`<div><div class="rot">${HOY.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</div><h2>${t}</h2></div>`;
  if(!r)return aviso+cab('Hoy')+`<p class="muted">Todavía no tenés una rutina cargada. Pedísela a tu profe.</p>`;
  semDe(r);const L=MD.log[hs],di=L?L.dia:MD.sem[wd(hs)],h=histEj();
  let rec='';
  if(!L||!nSets(L))for(let i=1;i<=6;i++){const f=mas(-i),E=MD.log[f];if(est(f,r)!=='no'||(E&&E.rec))continue;const dj=E?E.dia:MD.sem[wd(f)];if(!E&&!r.dias[dj])continue;
    rec=`<div class="card col"><b>El ${DSEML[wd(f)-1]} no hiciste ${esc(E?E.nombre:r.dias[dj].nombre)}.</b><div class="row"><button class="btn chico rayo" data-a="recuperar" data-f="${f}">Hacerla hoy</button><button class="btn chico fant" data-a="noRecuperar" data-f="${f}">Dejarla pasar</button></div></div>`;break}
  if(L&&L.falta&&!nSets(L))return aviso+cab('Hoy no vas')+`<p class="muted">Quedó anotado que hoy no asistís${L.nombre?' a '+esc(L.nombre):''}.</p><button class="btn" data-a="deshacerFalta">Deshacer</button>`;
  if(!L&&(di==null||!r.dias[di]))return aviso+cab('Hoy descansás')+rec+`<p class="muted">No tenés entrenamiento programado para hoy.</p><div class="col"><span class="rot">Entrenar igual</span><div class="row wrap">${r.dias.map((x,i)=>`<button class="chip" data-a="entrenarIgual" data-v="${i}">${esc(x.nombre)}</button>`).join('')}</div></div>`;
  const plan=L?L.plan:planDe(r,di),tot=totDe(plan),n=L?nSets(L):0;
  if(!tot)return aviso+cab(esc(L?L.nombre:r.dias[di].nombre))+`<p class="muted">Este día todavía no tiene ejercicios cargados.</p><button class="btn" data-a="tab" data-v="rutina">Ir a Mi rutina</button>${L?'<button class="btn fant" data-a="deshacerFalta">Elegir otro día</button>':''}`;
  return aviso+cab(esc(L?L.nombre:r.dias[di].nombre))+(n?'':rec)+
  `<div class="row"><div class="barra grow"><i style="width:${tot?Math.round(n/tot*100):0}%"></i></div><span class="num">${n} de ${tot} series</span></div>
  ${bloquesHoy(plan,L,h)}
  ${n?(n>=tot?'<p class="nota">Entrenamiento completo.</p>':''):'<button class="btn fant" data-a="noVoy">Hoy no voy</button>'}
  <p class="nota">Anotá los kilos y las repeticiones, y tocá el número de la serie al terminarla. Tocala de nuevo para desmarcarla.</p>`;
}
function vMiRutina(){
  const s=socio(S.socioId),g=rutinaDe(s),r=rutAct(s),puede=s.propias!==false;
  if(S.rutId&&(MD.rutinas||[]).some(x=>x.id===S.rutId))return vRutinas();

function calHtml(r,ym,tap){
  const y=+ym.slice(0,4),m=+ym.slice(5),n=new Date(y,m,0).getDate(),off=(new Date(y,m-1,1).getDay()||7)-1;
  let c=DSEM.map(d=>`<span class="rot">${d[0]}</span>`).join('')+'<span></span>'.repeat(off);
  for(let d=1;d<=n;d++){const f=ym+'-'+String(d).padStart(2,'0'),e=est(f,r);c+=`<button class="cd ${e} ${f===hoyS()?'hoy':''}" ${tap&&e?`data-a="verDia" data-f="${f}"`:'disabled'} aria-label="Día ${d}: ${({ok:'completo',par:'parcial',no:'faltó',plan:'programado'})[e]||'sin entrenamiento'}">${d}</button>`}
  return`<div class="cal">${c}</div>`;
}
function leyMes(r,ym){let ok=0,par=0,no=0;const n=new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();for(let d=1;d<=n;d++){const e=est(ym+'-'+String(d).padStart(2,'0'),r);if(e==='ok')ok++;else if(e==='par')par++;else if(e==='no')no++}
  return`<div class="row wrap ley2"><span><i class="ok"></i>Completo ${ok}</span><span><i class="par"></i>Parcial ${par}</span><span><i class="no"></i>Faltó ${no}</span><span><i class="plan"></i>Programado</span></div>`}
function progHtml(tap){

    return`<button class="item" ${tap?`data-a="verProg" data-id="${id}"`:'disabled'}><span class="grow"><span class="nom">${esc(ej(id).nombre)}</span><small>Última: ${txtSet(ult)} · ${fecha(lf)}</small></span>${best?`<span class="num" style="font-size:17px;white-space:nowrap">${numKg(best)} kg</span>`:''}</button>`}).join('')}</div>`;

function hojaDia(f){

  const tit={ok:'Entrenamiento completo',par:'Entrenamiento parcial',no:'No asististe',plan:'Programado'}[e]||'';
  return{t:esc(L?L.nombre:(r&&r.dias[di]?r.dias[di].nombre:'Día')),sub:deIso(f).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}),
    c:`<span class="pill ${e==='no'?'bad':e==='par'?'warn':'ok'}">${tit}</span><div class="lista">${plan.map((b,bi)=>b.it.map((it,ii)=>{const hs=Array.from({length:b.s},(_,n)=>L&&L.sets[bi+'-'+ii+'-'+n]).filter(Boolean);

function hojaProg(id){
  const a=histEj()[id]||[],by={};a.forEach(x=>{by[x.f]=Math.max(by[x.f]||0,x.kg)});const fs=Object.keys(by).sort(),v=fs.map(f=>by[f]),mx=Math.max(...v,0),mn=Math.min(...v);

  if(fs.length>1&&mx>0){const W=300,H=120,lo=Math.max(0,mn-(mx-mn||5)*.4),hi=mx+(mx-mn||5)*.25,X=i=>12+i*(W-24)/(fs.length-1),Y=k=>H-14-(k-lo)/(hi-lo)*(H-34),pts=v.map((k,i)=>X(i).toFixed(1)+','+Y(k).toFixed(1)).join(' ');
    g=`<div class="figbox" style="padding:6px"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de la carga: de ${numKg(v[0])} a ${numKg(v[v.length-1])} kilos"><line x1="12" y1="${H-14}" x2="${W-12}" y2="${H-14}" stroke="#30373a"/><polyline points="${pts}" fill="none" stroke="#2fc4c0" stroke-width="2" stroke-linejoin="round"/>${v.map((k,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(k).toFixed(1)}" r="${i===v.length-1?4:2.5}" fill="#2fc4c0"/>`).join('')}<text x="12" y="${(Y(v[0])-8).toFixed(1)}" font-size="11" fill="#8c979a" font-family="sans-serif">${numKg(v[0])}</text><text x="${W-12}" y="${(Y(v[v.length-1])-9).toFixed(1)}" font-size="12" fill="#eef1f1" text-anchor="end" font-family="sans-serif">${numKg(v[v.length-1])} kg</text></svg></div>`}
  return g+`<div class="row"><div class="tile grow"><span class="num">${mx?numKg(mx)+' kg':'—'}</span><span class="rot">Mejor carga</span></div><div class="tile grow"><span class="num">${fs.length}</span><span class="rot">Entrenamientos</span></div></div>

    ${multi?`<button class="btn rayo" data-a="crearSuper" ${h.sel.length<2?'disabled style="opacity:.5"':''}>Agregar ${h.sel.length<2?'superserie':h.sel.length===2?'superserie':h.sel.length===3?'triserie':'circuito'}</button>`:''}`}
  if(h.t==='nuevoEj')c=cab('Agregar ejercicio propio')+`<label class="campo"><span class="rot">Nombre</span><input type="text" id="eNombre"></label><label class="campo"><span class="rot">Grupo</span><select id="eGrupo">${GRUPOS_M.map(g=>`<option>${g}</option>`).join('')}</select></label>
    <div class="col"><span class="rot">Músculos que trabaja</span><div class="row wrap">${Object.keys(M).map(m=>`<button class="chip" aria-pressed="${h.sel.includes(m)}" data-a="togM" data-v="${m}">${M[m]}</button>`).join('')}</div></div><button class="btn rayo" data-a="crearEj">Guardar ejercicio</button>`;
  return`<div class="velo" data-a="velo"><div class="hoja" role="dialog" aria-modal="true">${c}</div></div>`;
}

/* ---------- render ---------- */
const TABS={admin:[['pagos','Pagos','fecha'],['socios','Socios','socio'],['rutinas','Rutinas','rayo'],['ejercicios','Ejercicios','pesa']],socio:[['hoy','Hoy','rayo'],['rutina','Mi rutina','pesa'],['historial','Historial','fecha'],['cuota','Mi cuota','socio']]};
function render(){
  const adm=S.rol==='admin';$('#red').textContent=RED;$('#app').classList.toggle('entrada',!S.dentro);
  if(!S.dentro){cancelAnimationFrame(raf);$('#modo').hidden=REAL;$('#modo').innerHTML='<span>Modelo de demostración</span>';$('.marca').hidden=true;$('#quien').innerHTML='';$('#view').innerHTML=vLogin();$('#tabs').innerHTML='';$('#sheet').innerHTML='';return}
  $('.marca').hidden=false;const prev=REAL&&S.ses.rol==='admin'&&!adm;$('#modo').hidden=REAL&&!prev;
  if(REAL)$('#modo').innerHTML=prev?'<span>Vista previa como socio</span><span class="seg"><button data-a="rol" data-v="admin">Volver al panel</button></span>':'';
  else $('#modo').innerHTML=`<span>Modelo · ver como</span>${adm?'':`<select id="selSocio" aria-label="Socio">${D.socios.map(s=>`<option value="${s.id}" ${s.id===S.socioId?'selected':''}>${esc(s.nombre)}</option>`).join('')}</select>`}<span class="seg"><button aria-pressed="${adm}" data-a="rol" data-v="admin">Dueño</button><button aria-pressed="${!adm}" data-a="rol" data-v="socio">Socio</button></span>`;
  $('#quien').innerHTML=(adm?'Panel del gimnasio':`Hola, <b style="color:var(--marmol)">${esc((socio(S.socioId)||{nombre:''}).nombre.split(' ')[0])}</b>`)+'<br><button class="btn chico fant" style="margin-top:4px;padding:2px 10px" data-a="salir">Salir</button>';
  $('#view').innerHTML=({pagos:vPagos,socios:vSocios,rutinas:vRutinas,ejercicios:vEjercicios,hoy:vHoy,rutina:vMiRutina,historial:vHistorial,cuota:vCuota}[S.tab])();
  $('#tabs').innerHTML=TABS[S.rol].map(([k,t,ic])=>`<button data-a="tab" data-v="${k}" ${S.tab===k?'aria-current="page"':''}><img src="ic-${ic}.png" alt="" width="26" height="26"><span>${t}</span></button>`).join('');
  renderHoja();
}
function renderHoja(){
  cancelAnimationFrame(raf);const keep=$('.hoja')?$('.hoja').scrollTop:0;
  $('#sheet').innerHTML=hoja();if($('.hoja'))$('.hoja').scrollTop=keep;
  if(S.sheet&&S.sheet.t==='ej'){const e=ej(S.sheet.id),box=$('#anim');
    if(!RIG[e.id]||matchMedia('(prefers-reduced-motion:reduce)').matches){if(RIG[e.id])box.innerHTML=fig(e,1);return}
    const t0=performance.now();const loop=n=>{const ph=((n-t0)%3000)/3000;box.innerHTML=fig(e,(1-Math.cos(ph*2*Math.PI))/2);raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop)}
}
const abrir=h=>{S.sheet=h;renderHoja()};
const diaAct=()=>{const r=rut(S.rutId);return r.dias[S.dia]||r.dias[0]};

/* ---------- acciones ---------- */
const A={
  rol:d=>{if(REAL&&S.ses.rol!=='admin')return;S.rol=d.v;S.rutId=null;S.tab=d.v==='admin'?'pagos':'hoy';S.sheet=null;if(!socio(S.socioId))S.socioId=D.socios[0]?.id;if(d.v==='socio'){MD=mdNorm({});mdLoad().then(render)}render()},
  tab:d=>{S.tab=d.v;if(S.rol==='socio')S.rutId=null;$('#view').scrollTop=0;render()},
  sub:d=>{S.sub=d.v;render()}, filtro:d=>{S.filtro=d.v;render()}, gm:d=>{S.gm=d.v;render()},
  cerrar:()=>{S.sheet=null;render()},
  velo:(d,ev)=>{if(ev.target.classList.contains('velo'))A.cerrar()},
  verEj:d=>abrir({t:'ej',id:d.id}), verSocio:d=>abrir({t:'socio',id:d.id}), cobrar:d=>abrir({t:'cobrar',id:d.id,medio:d.medio}),
  nuevoSocio:()=>abrir({t:'nuevoSocio'}), verGrupo:d=>abrir({t:'grupo',id:d.id}), asignar:()=>abrir({t:'asignar'}),
  nuevoEj:()=>abrir({t:'nuevoEj',sel:[]}), ajustes:()=>abrir({t:'ajustes'}),
  masPlan:()=>{D.planes.push({id:uid(),nombre:'Plan nuevo',precio:0});save();renderHoja()},
  confirmarPago:d=>{const s=socio(d.id),m=Number($('#monto').value)||0;if(m<=0)return toast('Ingresá un monto válido');
    s.pagos.unshift({fecha:iso(HOY),monto:m,medio:$('#medio').value});s.vence=masMes(d.base);D.avisos=D.avisos.filter(a=>a.socioId!==s.id);save();if(REAL)api('admin_aviso_borrar',{p_token:tk(),p_socio:s.id}).catch(()=>{});S.sheet=null;render();toast(`Pago de ${s.nombre.split(' ')[0]} registrado`)},
  descartarAviso:d=>{D.avisos=D.avisos.filter(a=>a.socioId!==d.id);save();if(REAL)api('admin_aviso_borrar',{p_token:tk(),p_socio:d.id}).catch(()=>{});render()},
  avisar:async()=>{if(REAL&&S.ses.rol==='admin')return toast('En la vista previa no se envían avisos');
    if(REAL){try{await api('socio_avisar',{p_token:tk()})}catch(e){return toast(e.message==='red'?'Sin conexión. Probá de nuevo.':e.message)}}
    D.avisos.push({socioId:S.socioId,fecha:iso(HOY)});save();render();toast('Aviso enviado al gimnasio')},
  pin:async d=>{const s=socio(d.id);let pin;
    if(REAL){try{await flush();pin=(await api('admin_pin',{p_token:tk(),p_socio:s.id})).pin;if(!ACC.includes(s.id))ACC.push(s.id)}catch(e){return toast(e.message==='red'?'Sin conexión. Probá de nuevo.':e.message)}}
    else pin=String(Math.floor(Math.random()*10000)).padStart(4,'0');
    abrir({t:'pin',id:s.id,pin,nuevo:d.nuevo==='1'})},
  entrar:async()=>{if(!REAL)return toast('En el modelo usá los botones de abajo');
    const tel=$('#lTel').value.trim(),pin=$('#lPin').value;if(!tel||!pin)return toast('Completá celular y PIN');
    try{S.ses=await api('login',{p_tel:tel,p_clave:pin});try{localStorage.setItem(SES,JSON.stringify(S.ses))}catch(e){}await entrarReal()}
    catch(e){toast(e.message==='red'?'Sin conexión. Probá de nuevo.':e.message)}},
  demo:d=>{S.ses={rol:'admin'};S.dentro=true;A.rol({v:d.v})},
  salir:()=>{if(REAL){api('salir',{p_token:tk()}).catch(()=>{});cerrarSesion()}else{S.dentro=false;S.sheet=null;render()}},
  crearSocio:()=>{const n=$('#nNombre').value.trim();if(!n)return toast('Falta el nombre');
    const tel=$('#nTel').value.trim();if(tel.replace(/\D/g,'').length<6)return toast('Falta el celular: es su usuario para entrar');
    const s={id:uid(),nombre:n,tel,plan:$('#nPlan').value,vence:iso(HOY),grupos:[],rutinaId:null,pagos:[]};D.socios.push(s);save();S.sheet=null;render();A.pin({id:s.id,nuevo:'1'})},
  borrarSocio:d=>{D.socios=D.socios.filter(s=>s.id!==d.id);save();S.sheet=null;render();toast('Socio dado de baja')},
  togGrupo:d=>{const s=socio(d.id);s.grupos=s.grupos.includes(d.g)?s.grupos.filter(x=>x!==d.g):[...s.grupos,d.g];save();render()},
  crearGrupo:()=>{const n=$('#nuevoGrupo').value.trim();if(!n)return toast('Escribí el nombre del grupo');const g={id:uid(),nombre:n,rutinaId:null};D.grupos.push(g);save();S.sheet={t:'grupo',id:g.id};render()},
  borrarGrupo:d=>{D.grupos=D.grupos.filter(g=>g.id!==d.id);D.socios.forEach(s=>s.grupos=s.grupos.filter(x=>x!==d.id));save();S.sheet=null;render()},
  verComo:d=>{S.socioId=d.id;A.rol({v:'socio'})},
  abrirRut:d=>{S.rutId=d.id||null;S.dia=0;$('#view').scrollTop=0;render()},
  nuevaRut:()=>{const r={id:uid(),nombre:'Rutina nueva',objetivo:'',dias:[{nombre:'Día A',bloques:[]}]};D.rutinas.push(r);save();A.abrirRut({id:r.id})},
  dia:d=>{S.dia=+d.v;render()}, diaSocio:d=>{S.diaSocio=+d.v;render()},
  masDia:()=>{const r=rut(S.rutId);r.dias.push({nombre:'Día '+'ABCDEFG'[r.dias.length%7],bloques:[]});S.dia=r.dias.length-1;save();render()},
  quitarBloque:d=>{diaAct().bloques.splice(+d.b,1);save();render()},
  subir:d=>{const b=diaAct().bloques,i=+d.b;if(i>0){[b[i-1],b[i]]=[b[i],b[i-1]];save();render()}},
  quitarItem:d=>{const b=diaAct().bloques[+d.b];b.items.splice(+d.i,1);save();render()},
  elegir:d=>abrir({t:'elegir',modo:d.modo,b:d.b,g:'Todos',sel:[]}),
  elegirG:d=>{S.sheet.g=d.v;renderHoja()},
  elegirEj:d=>{const h=S.sheet;
    if(h.modo==='simple'){diaAct().bloques.push({series:3,descanso:60,items:[{ej:d.id,reps:'10'}]})}
    else if(h.modo==='item'){diaAct().bloques[+h.b].items.push({ej:d.id,reps:'10'})}
    else{h.sel=h.sel.includes(d.id)?h.sel.filter(x=>x!==d.id):[...h.sel,d.id];return renderHoja()}
    save();S.sheet=null;render()},
  crearSuper:()=>{const h=S.sheet;if(h.sel.length<2)return;diaAct().bloques.push({series:3,descanso:60,items:h.sel.map(id=>({ej:id,reps:'12'}))});save();S.sheet=null;render()},
  asigGrupo:d=>{const g=D.grupos.find(x=>x.id===d.id);g.rutinaId=g.rutinaId===S.rutId?null:S.rutId;save();renderHoja()},
  asigSocio:d=>{const s=socio(d.id);s.rutinaId=s.rutinaId===S.rutId?null:S.rutId;save();renderHoja()},
  togM:d=>{const h=S.sheet;const n=$('#eNombre').value,g=$('#eGrupo').value;h.sel=h.sel.includes(d.v)?h.sel.filter(x=>x!==d.v):[...h.sel,d.v];renderHoja();$('#eNombre').value=n;$('#eGrupo').value=g},
  crearEj:()=>{const n=$('#eNombre').value.trim();if(!n)return toast('Falta el nombre');if(!S.sheet.sel.length)return toast('Marcá al menos un músculo');
    D.ejExtra.push({id:uid(),nombre:n,grupo:$('#eGrupo').value,prim:S.sheet.sel,sec:[],equipo:'',tip:''});save();S.sheet=null;render();toast('Ejercicio agregado')},
  serie:d=>{if(MDRO)return toast('En la vista previa no se guarda');const r=rutAct(socio(S.socioId)),hs=hoyS();let L=MD.log[hs];
    if(!L)L=MD.log[hs]=entrada(r,MD.sem[wd(hs)]);if(L.falta){delete L.falta;delete L.auto}
    const p=d.k.split('-'),k=p[0]+'-'+p[1],kg=$('#kg-'+k),rp=$('#rp-'+k);S.ed[k]={kg:kg?kg.value:'',reps:rp?rp.value.trim():''};
    if(L.sets[d.k])delete L.sets[d.k];else L.sets[d.k]={kg:+S.ed[k].kg||0,reps:S.ed[k].reps};mdSave();render()},
  kgmas:d=>{const el=$('#kg-'+d.k);if(!el)return;const v=Math.max(0,(+el.value||0)+(+d.v));el.value=v||'';S.ed[d.k]=Object.assign(S.ed[d.k]||{reps:$('#rp-'+d.k).value.trim()},{kg:el.value})},
  noVoy:()=>{if(MDRO)return;const r=rutAct(socio(S.socioId)),hs=hoyS(),di=MD.sem[wd(hs)];if(di==null||!r.dias[di])return;MD.log[hs]=entrada(r,di,{falta:true});mdSave();render()},
  deshacerFalta:()=>{if(MDRO)return;delete MD.log[hoyS()];mdSave();render()},
  entrenarIgual:d=>{if(MDRO)return;const r=rutAct(socio(S.socioId));S.ed={};MD.log[hoyS()]=entrada(r,+d.v);mdSave();render()},
  recuperar:d=>{if(MDRO)return;const r=rutAct(socio(S.socioId)),E=MD.log[d.f]||(MD.log[d.f]=entrada(r,MD.sem[wd(d.f)],{falta:true,auto:1}));E.rec=hoyS();S.ed={};MD.log[hoyS()]=E.plan?{rut:E.rut,dia:E.dia,nombre:E.nombre,sets:{},plan:JSON.parse(JSON.stringify(E.plan)),tot:E.tot}:entrada(r,E.dia);mdSave();render()},
  noRecuperar:d=>{if(MDRO)return;const r=rutAct(socio(S.socioId)),E=MD.log[d.f]||(MD.log[d.f]=entrada(r,MD.sem[wd(d.f)],{falta:true,auto:1}));E.rec='no';mdSave();render()},
  mes:d=>{const ym=S.mes||hoyS().slice(0,7),x=new Date(+ym.slice(0,4),+ym.slice(5)-1+(+d.v),1);S.mes=iso(x).slice(0,7);render()},
  usarRut:d=>{if(MDRO)return toast('En la vista previa no se guardan cambios');const s=socio(S.socioId),act=rutAct(s);if(act)cerrarFaltas(act);MD.activa=d.id||null;S.diaSocio=0;S.ed={};mdSave();render();toast('Rutina en uso cambiada')},
  crearPropia:()=>{if(MDRO)return toast('En la vista previa no se guardan cambios');const r={id:'p-'+uid(),nombre:'Mi rutina',objetivo:'Rutina propia',dias:[{nombre:'Día A',bloques:[]}]};MD.rutinas.push(r);mdSave();S.rutId=r.id;S.dia=0;$('#view').scrollTop=0;render()},
  personalizar:()=>{if(MDRO)return toast('En la vista previa no se guardan cambios');const s=socio(S.socioId),g=rutinaDe(s);if(!g)return;const eraG=rutAct(s)===g;
    const r=JSON.parse(JSON.stringify(g));r.id='p-'+uid();r.de=g.id;r.nombre=g.nombre+' (mía)';r.objetivo='Rutina propia';MD.rutinas.push(r);
    if(eraG){MD.activa=r.id;if(MD.semRut===g.id)MD.semRut=r.id}mdSave();S.rutId=r.id;S.dia=0;$('#view').scrollTop=0;render();toast('Copia creada. Los cambios son solo tuyos.')},
  borrarPropia:d=>{if(MDRO)return;const s=socio(S.socioId);if(MD.activa===d.id){const act=rutAct(s);if(act)cerrarFaltas(act);MD.activa=null}MD.rutinas=MD.rutinas.filter(x=>x.id!==d.id);S.rutId=null;mdSave();render();toast('Rutina eliminada')},
  togPropias:d=>{const s=socio(d.id);s.propias=s.propias===false;save();renderHoja()},
  verDia:d=>abrir({t:'dia',f:d.f}), verProg:d=>abrir({t:'prog',id:d.id}),
  verEntrenos:async d=>{let md,priv=false;
    if(REAL){try{const j=await api('admin_socio_datos',{p_token:tk(),p_socio:d.id});priv=!!j.privado;md=j.datos||{}}catch(e){return toast(e.message==='red'?'No se pudo leer. Revisá la conexión o si falta actualizar la base de datos.':e.message)}}
    else{try{md=JSON.parse(localStorage.getItem(mdKey(d.id)))}catch(e){}if(!md)md=mdDemo(socio(d.id));priv=md.comparte===false}
    abrir({t:'entrenos',id:d.id,md,priv})},
  copiar:()=>{try{navigator.clipboard.writeText(D.alias).then(()=>toast('Alias copiado'),()=>toast('Copialo a mano: '+D.alias))}catch(e){toast('Copialo a mano: '+D.alias)}}
};
const C={
  alias:el=>{D.alias=el.value.trim()},
  planNombre:el=>{D.planes[+el.dataset.i].nombre=el.value||'Plan'},
  planPrecio:el=>{D.planes[+el.dataset.i].precio=Math.max(0,+el.value||0)},
  rutNombre:el=>{rut(S.rutId).nombre=el.value||'Sin nombre'},
  diaNombre:el=>{diaAct().nombre=el.value||'Día';render()},
  reps:el=>{diaAct().bloques[+el.dataset.b].items[+el.dataset.i].reps=el.value},
  series:el=>{diaAct().bloques[+el.dataset.b].series=Math.max(1,Math.min(12,+el.value||1))},
  descanso:el=>{diaAct().bloques[+el.dataset.b].descanso=Math.max(0,+el.value||0)},
  rutSocio:el=>{socio(el.dataset.id).rutinaId=el.value||null;render()},
  rutGrupo:el=>{D.grupos.find(g=>g.id===el.dataset.id).rutinaId=el.value||null;render()}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f)f(el.dataset,ev)});
document.addEventListener('change',ev=>{const el=ev.target;if(el.id==='selSocio'){S.socioId=el.value;S.diaSocio=0;MD=mdNorm({});mdLoad().then(render);return render()}
  if(el.dataset.m==='sem'){if(MDRO)return toast('En la vista previa no se guardan cambios');const r=rutAct(socio(S.socioId));cerrarFaltas(r);if(el.value==='')delete MD.sem[el.dataset.w];else MD.sem[el.dataset.w]=+el.value;MD.semDesde=hoyS();mdSave();return render()}
  if(el.dataset.m==='comparte'){MD.comparte=el.checked;mdSave();return}
  if(el.dataset.ed){const k=el.dataset.k;S.ed[k]=S.ed[k]||{kg:$('#kg-'+k).value,reps:$('#rp-'+k).value};S.ed[k][el.dataset.ed]=el.value.trim();return}
  if(el.dataset.c&&C[el.dataset.c]){C[el.dataset.c](el);save()}});
document.addEventListener('input',ev=>{if(ev.target.id==='buscar'){S.q=ev.target.value;$('#lista').innerHTML=listaSocios()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.sheet)A.cerrar()});
async function entrarReal(){await cargar();S.rol=S.ses.rol;if(!socio(S.socioId))S.socioId=D.socios[0]?.id;S.tab=S.rol==='admin'?'pagos':'hoy';if(S.rol==='socio')await mdLoad();S.dentro=true;render()}
document.addEventListener('visibilitychange',()=>{HOY.setTime(new Date().setHours(0,0,0,0));if(REAL&&S.dentro&&!document.hidden&&!sucio&&!guardando&&!mdDirty&&!mdBusy&&!S.sheet)cargar().then(()=>S.rol==='socio'&&S.ses.rol==='socio'?mdLoad():0).then(render).catch(()=>{})});
render();
if(REAL){let s;try{s=JSON.parse(localStorage.getItem(SES))}catch(e){}
  if(s&&s.token){S.ses=s;entrarReal().catch(e=>{if(e.message==='red')toast('Sin conexión. Probá de nuevo.')})}}
</script>
